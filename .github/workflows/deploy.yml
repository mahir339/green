name: Blue-Green Deployment

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "index.html"
      - "index-v2.html"
      - "deploy.sh"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:
    inputs:
      app_file:
        description: "Application version to deploy"
        required: true
        type: choice
        options:
          - index.html
          - index-v2.html
        default: index-v2.html

permissions:
  contents: read

concurrency:
  group: blue-green-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy on local Ubuntu runner
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment script
        shell: bash
        run: bash -n deploy.sh

      - name: Deploy application
        shell: bash
        env:
          APP_FILE: ${{ inputs.app_file || 'index-v2.html' }}
        run: |
          chmod +x deploy.sh
          ./deploy.sh
